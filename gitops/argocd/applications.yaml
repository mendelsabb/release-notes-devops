# Argo CD owns everything in the dev and prod namespaces. Both environments use
# the same chart; they differ only in gitops/environments/<env>/*.yaml.
#
# repoURL is the in-cluster git mirror populated from your checkout by
# `make up` / the release scripts. With a hosted repo, point repoURL at it
# (e.g. https://github.com/<owner>/<repo>.git) and nothing else changes.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: release-notes
  namespace: argocd
spec:
  description: Release Notes service (dev and prod)
  sourceRepos:
    - http://git-server.git.svc.cluster.local/release-notes.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: dev }
    - { server: https://kubernetes.default.svc, namespace: prod }
  # Namespaces are platform-owned (scripts/up.sh); apps may not create cluster-scoped resources.
  clusterResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-notes-dev
  namespace: argocd
  labels: { environment: dev }
spec:
  project: release-notes
  source:
    repoURL: http://git-server.git.svc.cluster.local/release-notes.git
    targetRevision: main
    path: helm/release-notes
    helm:
      releaseName: release-notes
      valueFiles:
        - ../../gitops/environments/dev/values.yaml
        - ../../gitops/environments/dev/image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff: { duration: 5s, factor: 2, maxDuration: 30s }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-notes-prod
  namespace: argocd
  labels: { environment: prod }
spec:
  project: release-notes
  source:
    repoURL: http://git-server.git.svc.cluster.local/release-notes.git
    targetRevision: main
    path: helm/release-notes
    helm:
      releaseName: release-notes
      valueFiles:
        - ../../gitops/environments/prod/values.yaml
        - ../../gitops/environments/prod/image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Automated sync is safe for prod because the gate is the reviewed commit
    # (promotion PR) that changes prod/image.yaml, not a manual click.
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff: { duration: 5s, factor: 2, maxDuration: 30s }
