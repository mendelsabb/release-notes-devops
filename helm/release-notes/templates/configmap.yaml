apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  PORT: {{ .Values.app.port | quote }}
  GRACEFUL_TIMEOUT: {{ .Values.shutdown.gracefulTimeoutSeconds | quote }}
  DATABASE_HOST: {{ include "release-notes.dbHost" . | quote }}
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.database.name | quote }}
  DB_POOL_SIZE: {{ .Values.app.dbPoolSize | quote }}
  DB_MAX_OVERFLOW: {{ .Values.app.dbMaxOverflow | quote }}
