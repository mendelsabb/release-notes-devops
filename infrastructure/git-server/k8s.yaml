apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server
  namespace: git
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git
  labels: { app.kubernetes.io/name: git-server }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: git-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: git-server }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: git-server
          image: GIT_SERVER_IMAGE
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: repos, mountPath: /srv/git }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: repos
          persistentVolumeClaim: { claimName: git-server }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git
spec:
  type: NodePort # host access (127.0.0.1:8418) is only for `git push` from scripts
  selector: { app.kubernetes.io/name: git-server }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30418 }
