# Application namespaces enforce the "restricted" Pod Security Standard, which
# proves the chart's security contexts are actually accepted by the API server.
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    environment: dev
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    environment: prod
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Local stand-in for GitHub: the git repository Argo CD watches.
apiVersion: v1
kind: Namespace
metadata:
  name: git
