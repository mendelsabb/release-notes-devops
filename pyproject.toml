[project]
name = "release-notes"
version = "1.0.0"
description = "Internal Release Notes service: record and list software releases."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.152.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]
# PromQL/LogQL strings read better unbroken.
"scripts/gen_dashboard.py" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "integration: requires a PostgreSQL database (TEST_DATABASE_URL)",
    "chart: renders the Helm chart (requires helm on PATH)",
]
